context:
  version: "3.1.2"

package:
  name: erdtree
  version: ${{ version }}

source:
  url: https://github.com/solidiquis/erdtree/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 1758e7ad8f7be59bc3c6bda8b058097509f9db6f40ad57c4b0b361e3be439297

build:
  number: 4
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = ($prefix)/bin/erd
          - ^$bin --completions=bash | save ($prefix)/share/bash-completion/completions/erd
          - ^$bin --completions=fish | save ($prefix)/share/fish/vendor_completions.d/erd.fish
          - ^$bin --completions=zsh  | save ($prefix)/share/zsh/site-functions/_erd
  skip: win

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell

tests:
  - script:
      - erd --help
      - erd --version
  - package_contents:
      bin:
        - erd
      files:
        - if: unix
          then:
            - share/bash-completion/completions/erd
            - share/fish/vendor_completions.d/erd.fish
            - share/zsh/site-functions/_erd
        - if: win
          then:
            - Library/share/bash-completion/completions/erd
            - Library/share/fish/vendor_completions.d/erd.fish
            - Library/share/zsh/site-functions/_erd
      strict: true

about:
  homepage: https://github.com/solidiquis/erdtree
  repository: https://github.com/solidiquis/erdtree
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: A modern, cross-platform, multi-threaded, and general purpose filesystem and disk-usage utility.
  description: |
    erdtree (erd) is a cross-platform, multi-threaded, and general purpose
    filesystem and disk usage utility that is aware of .gitignore and hidden file rules.

extra:
  recipe-maintainers:
    - salim-b
